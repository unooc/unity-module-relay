name: Fetch Unity UWP Module

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Probe official candidate URLs
        run: |
          BASE="https://download.unity3d.com/download_unity/e4c6bad08822"
          urls=(
            "$BASE/WindowsEditorTargetInstaller/UnitySetup-UWP-IL2CPP-Support-for-Editor-2019.3.13f1.exe"
            "$BASE/TargetSupportInstaller/UnitySetup-UWP-IL2CPP-Support-for-Editor-2019.3.13f1.exe"
            "$BASE/WindowsEditorTargetInstaller/UnitySetup-UWP-.NET-Support-for-Editor-2019.3.13f1.exe"
            "$BASE/TargetSupportInstaller/UnitySetup-UWP-.NET-Support-for-Editor-2019.3.13f1.exe"
            "$BASE/WindowsEditorTargetInstaller/UnitySetup-Windows-IL2CPP-Support-for-Editor-2019.3.13f1.exe"
            "$BASE/TargetSupportInstaller/UnitySetup-Windows-IL2CPP-Support-for-Editor-2019.3.13f1.exe"
            "$BASE/WindowsEditorTargetInstaller/UnitySetup-Windows-Mono-Support-for-Editor-2019.3.13f1.exe"
            "$BASE/TargetSupportInstaller/UnitySetup-Windows-Mono-Support-for-Editor-2019.3.13f1.exe"
            "$BASE/Windows64EditorInstaller/UnitySetup64-2019.3.13f1.exe"
          )
          : > probe_results.txt
          : > hits.txt
          for u in "${urls[@]}"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L -r 0-0 -A "Mozilla/5.0" --max-time 60 "$u")
            echo "$code  $u"
            echo "$code  $u" >> probe_results.txt
            if [ "$code" = "200" ] || [ "$code" = "206" ]; then echo "$u" >> hits.txt; fi
          done
          echo "=== HITS ===" | tee -a probe_results.txt
          cat hits.txt | tee -a probe_results.txt
          echo "=== manifest fallback ===" | tee -a probe_results.txt
          for mf in releases.json releases-win32.json releases-darwin.json releases-linux.json; do
            url="https://public-cdn.cloud.unity3d.com/hub/prod/$mf"
            code=$(curl -s -o rel.json -w "%{http_code}" -L -A "Mozilla/5.0" --max-time 60 "$url")
            echo "manifest $mf -> $code ($(stat -c%s rel.json 2>/dev/null) bytes)" | tee -a probe_results.txt
            if [ "$code" = "200" ]; then
              jq -r '.. | objects | select(has("downloadUrl")) | .downloadUrl | strings | select(contains("2019.3.13f1"))' rel.json >> probe_results.txt
            fi
          done
          if [ -s hits.txt ]; then echo "HIT FOUND" | tee -a probe_results.txt; fi

      - name: Download module
        continue-on-error: true
        run: |
          if [ -s hits.txt ]; then
            URL=$(head -n1 hits.txt)
            echo "downloading: $URL"
            curl -fL --retry 2 --retry-delay 5 -A "Mozilla/5.0" -o module.exe "$URL"
            ls -lh module.exe || true
            file module.exe || true
            sha256sum module.exe || true
            SZ=$(stat -c%s module.exe 2>/dev/null || echo 0)
            echo "size_bytes=$SZ"
          else
            echo "no hit, nothing to download"
          fi

      - name: Publish probe results (always)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="probe-$(date +%Y%m%d-%H%M%S)"
          if [ -s module.exe ]; then
            gh release create -R "$GITHUB_REPOSITORY" "$TAG" module.exe probe_results.txt \
              --title "Unity 2019.3.13f1 UWP module - probe $(date +%H:%M)" \
              --notes "probe_results.txt contains status of each candidate URL."
          else
            gh release create -R "$GITHUB_REPOSITORY" "$TAG" probe_results.txt \
              --title "Unity 2019.3.13f1 UWP module - probe $(date +%H:%M)" \
              --notes "No module downloaded yet; probe_results.txt contains status of each candidate URL."
          fi
          echo "release tag: $TAG"
