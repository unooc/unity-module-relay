name: Fetch Unity UWP Module

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Discover real module URL from Unity official index
        run: |
          set -e
          echo "Fetching Unity Hub release manifest ..."
          curl -fsSL --retry 3 --retry-delay 5 -o rel.json \
            "https://public-cdn.cloud.unity3d.com/hub/prod/releases.json"
          ls -lh rel.json
          python3 - <<'PY'
import json
data = json.load(open('rel.json'))
urls = []
def walk(o):
    if isinstance(o, dict):
        if 'downloadUrl' in o and isinstance(o['downloadUrl'], str):
            urls.append(o['downloadUrl'])
        for v in o.values():
            walk(v)
    elif isinstance(o, list):
        for v in o:
            walk(v)
walk(data)
cand = [u for u in urls if '2019.3.13f1' in u]
print('total downloadUrls:', len(urls))
print('urls mentioning 2019.3.13f1:', len(cand))
for u in cand:
    print('  ', u)
pick = [u for u in cand if ('UWP-IL2CPP' in u) or ('IL2CPP-Support' in u)]
if pick:
    print('SELECTED=', pick[0])
    open('module_url.txt', 'w').write(pick[0] + '\n')
else:
    print('NO_MATCH - cannot find UWP-IL2CPP module url for 2019.3.13f1')
    raise SystemExit(2)
PY
          cat module_url.txt

      - name: Download module
        run: |
          set -e
          URL=$(cat module_url.txt)
          echo "downloading: $URL"
          curl -fL --retry 3 --retry-delay 5 -o module.exe "$URL"
          ls -lh module.exe
          file module.exe
          echo "=== sha256 ==="
          sha256sum module.exe
          SZ=$(stat -c%s module.exe)
          echo "size_bytes=$SZ"
          head -c 2 module.exe | od -An -tx1 | grep -qi "4d 5a" || { echo "NOT a PE file!"; exit 1; }
          if [ "$SZ" -lt 100000000 ]; then echo "too small, abort"; exit 1; fi

      - name: Create GitHub Release and upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="hl1-uwp-module-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" module.exe \
            --title "Unity 2019.3.13f1 UWP-IL2CPP Support module" \
            --notes "官方安装包（Unity 官方清单中查到的地址）。下载后请与 Actions 日志中的 sha256 比对。"
          echo "release tag: $TAG"
