name: Fetch Unity UWP Module

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Discover real module URL from Unity official index
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o rel.json \
            "https://public-cdn.cloud.unity3d.com/hub/prod/releases.json"
          ls -lh rel.json
          jq -r '.. | objects | select(has("downloadUrl")) | .downloadUrl | strings | select(contains("2019.3.13f1"))' rel.json | tee candidates.txt
          grep -E 'UWP-IL2CPP|IL2CPP-Support' candidates.txt | head -n1 > module_url.txt
          if [ ! -s module_url.txt ]; then
            echo "NO_MATCH found, candidates were:"
            cat candidates.txt
            exit 2
          fi
          echo "SELECTED: $(cat module_url.txt)"

      - name: Download module
        run: |
          set -e
          URL=$(cat module_url.txt)
          echo "downloading: $URL"
          curl -fL --retry 3 --retry-delay 5 -o module.exe "$URL"
          ls -lh module.exe
          file module.exe
          echo "=== sha256 ==="
          sha256sum module.exe
          SZ=$(stat -c%s module.exe)
          echo "size_bytes=$SZ"
          head -c 2 module.exe | od -An -tx1 | grep -qi "4d 5a" || { echo "NOT a PE file!"; exit 1; }
          if [ "$SZ" -lt 100000000 ]; then echo "too small, abort"; exit 1; fi

      - name: Create GitHub Release and upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="hl1-uwp-module-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" module.exe \
            --title "Unity 2019.3.13f1 UWP-IL2CPP Support module" \
            --notes "官方安装包（Unity 官方清单中查到的地址）。下载后请与 Actions 日志中的 sha256 比对。"
          echo "release tag: $TAG"
